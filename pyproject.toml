[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "installer-vise"
version = "1.0.0"
description = "Extractor for Installer VISE 3.x archives (reverse-engineered classic-Mac format)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mrmidi" }]
keywords = [
    "installer-vise", "mindvision", "classic-mac", "macos",
    "deflate", "retro", "reverse-engineering", "disk-image",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
installer-vise = "installer_vise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/installer_vise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
