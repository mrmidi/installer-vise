[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "installer-vise"
version = "0.1.0"
description = "Experimental extractor for Installer VISE 3.x archives, supporting both compressed-catalog and raw-catalog variants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mrmidi" }]
keywords = [
    "installer-vise", "mindvision", "classic-mac", "macos",
    "deflate", "retro", "reverse-engineering", "disk-image",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: System :: Emulators",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
installer-vise = "installer_vise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/installer_vise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
